<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="Architects Daughter">
<defs>
<filter id="r" x="-8%" y="-25%" width="116%" height="150%"><feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="3" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/></filter>
<filter id="r2" x="-12%" y="-40%" width="124%" height="180%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="21" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.9" xChannelSelector="R" yChannelSelector="G"/></filter>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6560"/></marker>
</defs>
<rect width="1000" height="330" fill="#ffffff"/>
<g stroke="#1e1e1e" stroke-width="1.8" fill="none" filter="url(#r2)">
  <line x1="30" y1="40" x2="970" y2="40"/><line x1="30" y1="32" x2="30" y2="48"/><line x1="970" y1="32" x2="970" y2="48"/>
</g>
<text x="500" y="26" font-size="17" text-anchor="middle" fill="#1e1e1e">500 ms end-to-end SLA (caller speaks &#8594; score delivered)</text>
<g filter="url(#r2)" stroke="#1e1e1e" stroke-width="2.2">
  <rect x="30"  y="66" width="56"  height="62" fill="#f5f2ec"/>
  <rect x="86"  y="66" width="10"  height="62" fill="#f5f2ec"/>
  <rect x="96"  y="66" width="113" height="62" fill="#b2f2bb"/>
  <rect x="209" y="66" width="188" height="62" fill="#a5d8ff"/>
  <rect x="397" y="66" width="19"  height="62" fill="#f5f2ec"/>
  <rect x="416" y="66" width="376" height="62" fill="#eebefa"/>
  <rect x="792" y="66" width="38"  height="62" fill="#a5d8ff"/>
  <rect x="830" y="66" width="19"  height="62" fill="#f5f2ec"/>
  <rect x="849" y="66" width="121" height="62" fill="#ffec99"/>
</g>
<g font-size="15" text-anchor="middle" fill="#1e1e1e">
  <text x="58" y="103">30</text><text x="152" y="103">60</text><text x="303" y="103">100</text>
  <text x="604" y="103">200</text><text x="811" y="103">20</text><text x="909" y="103">65</text>
</g>
<g stroke="#928b84" stroke-width="1.2" fill="none">
  <line x1="58" y1="132" x2="58" y2="152"/><line x1="152" y1="132" x2="152" y2="180"/>
  <line x1="303" y1="132" x2="303" y2="152"/><line x1="604" y1="132" x2="604" y2="208"/>
  <line x1="811" y1="132" x2="811" y2="180"/><line x1="909" y1="132" x2="909" y2="152"/>
</g>
<g font-size="15" text-anchor="middle" fill="#1e1e1e">
  <text x="58" y="168">gateway</text>
  <text x="152" y="196">jitter buffer</text>
  <text x="303" y="168">window fill</text>
  <text x="604" y="226" font-size="17" font-weight="bold" fill="#9c36b5">inference (3) — 46% of the whole budget</text>
  <text x="811" y="196">reorder</text>
  <text x="909" y="168" fill="#f08c00">slack</text>
</g>
<g fill="#6b6560" font-size="15">
  <text x="30" y="268">Every stage is measured separately. A single end-to-end number cannot tell you which of</text>
  <text x="30" y="290">the four of us regressed — and each of us will assume it was one of the other three.</text>
  <text x="30" y="316" fill="#e03131">Time-to-first-score is ~2.4 s (a full 2 s window must exist first) — not 500 ms.</text>
</g>
</svg>
