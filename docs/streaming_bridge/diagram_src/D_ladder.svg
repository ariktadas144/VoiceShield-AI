<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="Architects Daughter">
<defs>
<filter id="r" x="-8%" y="-25%" width="116%" height="150%"><feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="3" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/></filter>
<filter id="r2" x="-12%" y="-40%" width="124%" height="180%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="21" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.9" xChannelSelector="R" yChannelSelector="G"/></filter>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6560"/></marker>
</defs>
<rect width="1000" height="330" fill="#ffffff"/>
<g filter="url(#r)" stroke-width="2.8" fill="none">
  <rect x="14"  y="20"  width="186" height="62" rx="9" stroke="#2f9e44" fill="#b2f2bb"/>
  <rect x="208" y="66"  width="186" height="62" rx="9" stroke="#2f9e44" fill="#d3f9d8"/>
  <rect x="402" y="112" width="186" height="62" rx="9" stroke="#f08c00" fill="#ffec99"/>
  <rect x="596" y="158" width="186" height="62" rx="9" stroke="#e03131" fill="#ffc9c9"/>
  <rect x="790" y="204" width="196" height="62" rx="9" stroke="#e03131" fill="#ffe3e3"/>
</g>
<g stroke="#6b6560" stroke-width="2" fill="none" marker-end="url(#ah)" filter="url(#r2)">
  <path d="M202,62 L205,62 L205,90"/><path d="M396,108 L399,108 L399,136"/>
  <path d="M590,154 L593,154 L593,182"/><path d="M784,200 L787,200 L787,228"/>
</g>
<g fill="#1e1e1e">
  <text x="28" y="46" font-size="16" font-weight="bold">L0 &#183; NORMAL</text>
  <text x="28" y="68" font-size="13" fill="#3d3d3d">2 s window / 100 ms hop</text>
  <text x="222" y="92" font-size="16" font-weight="bold">L1 &#183; ELEVATED</text>
  <text x="222" y="114" font-size="13" fill="#3d3d3d">hop widens &#8594; 200 ms</text>
  <text x="416" y="138" font-size="16" font-weight="bold">L2 &#183; DEGRADED</text>
  <text x="416" y="160" font-size="13" fill="#3d3d3d">hop 500 ms, drop oldest</text>
  <text x="610" y="184" font-size="16" font-weight="bold">L3 &#183; DETECTOR DOWN</text>
  <text x="610" y="206" font-size="13" fill="#3d3d3d">scoring stops, call lives</text>
  <text x="804" y="230" font-size="16" font-weight="bold">L4 &#183; SHEDDING</text>
  <text x="804" y="252" font-size="13" fill="#3d3d3d">reject NEW sessions only</text>
</g>
<g filter="url(#r)" stroke-width="2.6" fill="none"><rect x="14" y="278" width="972" height="44" rx="9" stroke="#e03131" fill="#fff5f5"/></g>
<text x="30" y="298" font-size="15" font-weight="bold" fill="#e03131">GOVERNING RULE: absence of a score is never equivalent to a low score.</text>
<text x="30" y="316" font-size="14" fill="#1e1e1e">Reporting "genuine" when the pipeline is broken is the one failure mode that actively causes harm — it green-lights the fraud we exist to stop.</text>
</svg>
