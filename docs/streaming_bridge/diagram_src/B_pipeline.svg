<g fill="#6b6560" font-size="14">
  <text x="10" y="330">One asyncio loop, no per-session threads (1,200 threads = 9.6 GB of stack alone).</text>
  <text x="10" y="352">Resampling + VAD run off the event loop — a 5 ms block x 1,200 sessions = 300 s/s of stall.</text>
</g>
