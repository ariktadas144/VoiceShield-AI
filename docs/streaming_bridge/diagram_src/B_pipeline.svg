  <text x="101" y="58" font-size="12" fill="#6b6560">WS · L16 · 8/16 kHz</text>
  <text x="101" y="106" font-size="16" font-weight="bold">Asterisk</text>
  <text x="101" y="126" font-size="12" fill="#6b6560">TCP · AudioSocket</text>
  <text x="101" y="174" font-size="16" font-weight="bold">Twilio</text>
  <text x="101" y="194" font-size="12" fill="#6b6560">WSS · base64 mu-law</text>
  <text x="312" y="102" font-size="15" font-weight="bold">INGRESS</text>
  <text x="312" y="122" font-size="15" font-weight="bold">ADAPTERS</text>
  <text x="312" y="142" font-size="12" fill="#1971c2">N formats &#8594; 1</text>
  <text x="483" y="106" font-size="14" font-weight="bold">SESSION</text>
  <text x="483" y="124" font-size="14" font-weight="bold">MANAGER</text>
  <text x="483" y="140" font-size="11" fill="#1971c2">consent &#183; fence</text>
  <text x="651" y="106" font-size="14" font-weight="bold">RING</text>
  <text x="651" y="124" font-size="14" font-weight="bold">BUFFER</text>
  <text x="651" y="140" font-size="11" fill="#1971c2">256 KB cap</text>
  <text x="819" y="106" font-size="14" font-weight="bold">WINDOWER</text>
  <text x="819" y="124" font-size="12" fill="#1971c2">2.0 s / 100 ms</text>
  <text x="819" y="140" font-size="11" fill="#1971c2">VAD-gated</text>
  <text x="998" y="106" font-size="14" font-weight="bold">gRPC POOL</text>
  <text x="998" y="124" font-size="12" fill="#9c36b5">bidi stream</text>
  <text x="998" y="140" font-size="11" fill="#9c36b5">batch = 1</text>
  <text x="819" y="258" font-size="14" font-weight="bold">REORDER</text>
  <text x="819" y="276" font-size="11" fill="#6b6560">by window_seq</text>
  <text x="651" y="258" font-size="14" font-weight="bold">FAN-OUT</text>
  <text x="651" y="276" font-size="11" fill="#6b6560">dedupe · gaps</text>
